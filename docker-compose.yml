version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: karmayogi
      POSTGRES_USER: karmayogi_user
      POSTGRES_PASSWORD: karmayogi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karmayogi_user -d karmayogi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Queue Management
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Karmayogi Application
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://karmayogi_user:karmayogi_password@postgres:5432/karmayogi
      REDIS_URL: redis://:redis_password@redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 7d
      QUEUE_CONCURRENCY: 5
      MAX_RETRY_ATTEMPTS: 3
      RETRY_BACKOFF_DELAY: 2000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      METRICS_PORT: 9090
      WEBSOCKET_CORS_ORIGIN: http://localhost:3000
      # Go Services gRPC URLs
      WORKER_SERVICE_URL: go-worker:50051
      EXECUTOR_SERVICE_URL: go-executor:50052
    ports:
      - "3000:3000"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-worker:
        condition: service_healthy
      go-executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - app

  # Grafana for Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  # Go Worker Service - High-performance job processing with goroutines
  go-worker:
    build:
      context: ./go-services/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WORKER_PORT: 50051
      DATABASE_URL: postgresql://karmayogi_user:karmayogi_password@postgres:5432/karmayogi
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_POOL_SIZE: 1000
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Go Executor Service - Specialized job type handlers
  go-executor:
    build:
      context: ./go-services/executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EXECUTOR_PORT: 50052
      DATABASE_URL: postgresql://karmayogi_user:karmayogi_password@postgres:5432/karmayogi
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50052"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: karmayogi-network